<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpielePortal - 5 Kategorien</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #6b00ff, #00d4ff);
    }
    h1 { font-size: 2.8rem; margin-bottom: 8px; }

    #search {
      width: 90%;
      max-width: 600px;
      padding: 14px 20px;
      margin: 20px auto;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      display: block;
    }

    #theme-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 15px;
      background: #1a1a2e;
    }
    .theme-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      background: #16213e;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .theme-btn.active, .theme-btn:hover {
      background: #00d4ff;
      color: black;
    }

    #games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    .game-card {
      background: #16213e;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s;
      cursor: pointer;
    }
    .game-card:hover { transform: scale(1.08); }
    .game-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .game-info { padding: 15px; }
    .game-info h3 { margin-bottom: 6px; }
    .play-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #00ff88;
      color: black;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* Vollbild */
    #game-container {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      background: #000;
      z-index: 1000;
      flex-direction: column;
    }
    #game-header {
      background: rgba(0,0,0,0.9);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #back-btn {
      padding: 10px 22px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    #game-title { font-size: 1.4rem; }
    #game-frame {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 SpielePortal</h1>
    <p>5 Kategorien • Viele HTML5 Spiele</p>
  </header>

  <input type="text" id="search" placeholder="🔍 Spiele suchen..." onkeyup="filterGames()">

  <nav id="theme-nav"></nav>

  <div id="games-container"></div>

  <!-- Vollbild Container -->
  <div id="game-container">
    <div id="game-header">
      <button id="back-btn">← Zurück</button>
      <div id="game-title"></div>
      <div></div>
    </div>
    <iframe id="game-frame" allowfullscreen></iframe>
  </div>

  <script>
    // ====================== 5 KATEGORIEN + SPIELE ======================
    const games = [
      // === ARCADE ===
      { title: "Flappy Bird", theme: "Arcade", thumbnail: "https://picsum.photos/id/1015/300/160", url: "https://flappybird.io" },
      { title: "Snake", theme: "Arcade", thumbnail: "https://picsum.photos/id/237/300/160", url: "https://www.google.com/fbx?fbx=snake" },
      { title: "Pac-Man", theme: "Arcade", thumbnail: "https://picsum.photos/id/180/300/160", url: "https://freepacman.org" },
      { title: "Subway Surfers", theme: "Arcade", thumbnail: "https://picsum.photos/id/866/300/160", url: "https://poki.com/en/g/subway-surfers" },
      { title: "Temple Run", theme: "Arcade", thumbnail: "https://picsum.photos/id/201/300/160", url: "https://poki.com/en/g/temple-run-2" },
      { title: "Geometry Dash", theme: "Arcade", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://poki.com/en/g/geometry-dash" },
      { title: "Stack Ball", theme: "Arcade", thumbnail: "https://picsum.photos/id/251/300/160", url: "https://poki.com/en/g/stack-ball" },
      { title: "Helix Jump", theme: "Arcade", thumbnail: "https://picsum.photos/id/870/300/160", url: "https://poki.com/en/g/helix-jump" },
      { title: "Color Switch", theme: "Arcade", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://poki.com/en/g/color-switch" },

      // === PUZZLE ===
      { title: "2048", theme: "Puzzle", thumbnail: "https://picsum.photos/id/201/300/160", url: "https://play2048.co" },
      { title: "Tetris", theme: "Puzzle", thumbnail: "https://picsum.photos/id/180/300/160", url: "https://tetris.com/play-tetris" },
      { title: "Sudoku", theme: "Puzzle", thumbnail: "https://picsum.photos/id/251/300/160", url: "https://poki.com/en/g/sudoku" },
      { title: "Candy Crush", theme: "Puzzle", thumbnail: "https://picsum.photos/id/866/300/160", url: "https://poki.com/en/g/candy-crush-saga" },
      { title: "Wordle", theme: "Puzzle", thumbnail: "https://picsum.photos/id/1015/300/160", url: "https://www.nytimes.com/games/wordle/index.html" },
      { title: "Bubble Shooter", theme: "Puzzle", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://poki.com/en/g/bubble-shooter" },
      { title: "Mahjong", theme: "Puzzle", thumbnail: "https://picsum.photos/id/237/300/160", url: "https://poki.com/en/g/mahjong" },
      { title: "Memory Cards", theme: "Puzzle", thumbnail: "https://picsum.photos/id/870/300/160", url: "https://poki.com/en/g/memory" },
      { title: "Flow Free", theme: "Puzzle", thumbnail: "https://picsum.photos/id/201/300/160", url: "https://poki.com/en/g/flow-free" },

      // === RACING ===
      { title: "Highway Racer", theme: "Racing", thumbnail: "https://picsum.photos/id/1074/300/160", url: "https://www.crazygames.com/game/highway-racer" },
      { title: "Drift Racing", theme: "Racing", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://poki.com/en/g/drift-racing" },
      { title: "Moto X3M", theme: "Racing", thumbnail: "https://picsum.photos/id/180/300/160", url: "https://poki.com/en/g/moto-x3m" },
      { title: "Car Parking", theme: "Racing", thumbnail: "https://picsum.photos/id/251/300/160", url: "https://poki.com/en/g/car-parking" },
      { title: "Crazy Taxi", theme: "Racing", thumbnail: "https://picsum.photos/id/866/300/160", url: "https://poki.com/en/g/crazy-taxi" },

      // === ACTION ===
      { title: "Stickman Hook", theme: "Action", thumbnail: "https://picsum.photos/id/1015/300/160", url: "https://poki.com/en/g/stickman-hook" },
      { title: "Rooftop Snipers", theme: "Action", thumbnail: "https://picsum.photos/id/237/300/160", url: "https://poki.com/en/g/rooftop-snipers" },
      { title: "Getaway Shootout", theme: "Action", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://poki.com/en/g/getaway-shootout" },
      { title: "Sniper 3D", theme: "Action", thumbnail: "https://picsum.photos/id/201/300/160", url: "https://poki.com/en/g/sniper-3d" },
      { title: "Tanks.io", theme: "Action", thumbnail: "https://picsum.photos/id/870/300/160", url: "https://poki.com/en/g/tanks-io" },
      { title: "Krunker.io", theme: "Action", thumbnail: "https://picsum.photos/id/180/300/160", url: "https://krunker.io" },

      // === ADVENTURE ===
      { title: "Mario", theme: "Adventure", thumbnail: "https://picsum.photos/id/1074/300/160", url: "https://supermarioemulator.com" },
      { title: "Among Us", theme: "Adventure", thumbnail: "https://picsum.photos/id/866/300/160", url: "https://poki.com/en/g/among-us" },
      { title: "Sonic", theme: "Adventure", thumbnail: "https://picsum.photos/id/251/300/160", url: "https://poki.com/en/g/sonic" },
      { title: "Minecraft Classic", theme: "Adventure", thumbnail: "https://picsum.photos/id/133/300/160", url: "https://classic.minecraft.net" },
      { title: "Happy Wheels", theme: "Adventure", thumbnail: "https://picsum.photos/id/237/300/160", url: "https://poki.com/en/g/happy-wheels" },
      { title: "Bad Ice Cream", theme: "Adventure", thumbnail: "https://picsum.photos/id/201/300/160", url: "https://poki.com/en/g/bad-ice-cream" }
    ];

    const themes = ["Arcade", "Puzzle", "Racing", "Action", "Adventure"];

    let currentFilter = "all";

    function renderThemes() {
      const nav = document.getElementById('theme-nav');
      nav.innerHTML = `<button class="theme-btn active" data-theme="all">Alle Spiele</button>`;

      themes.forEach(theme => {
        const btn = document.createElement('button');
        btn.className = 'theme-btn';
        btn.textContent = theme;
        btn.dataset.theme = theme;
        nav.appendChild(btn);
      });

      nav.addEventListener('click', e => {
        if (!e.target.classList.contains('theme-btn')) return;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.theme;
        filterGames();
      });
    }

    function renderGames(filteredGames) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';

      filteredGames.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.thumbnail}" alt="${game.title}">
          <div class="game-info">
            <h3>${game.title}</h3>
            <p>${game.theme}</p>
            <a class="play-btn">Jetzt spielen</a>
          </div>
        `;
        card.onclick = () => playGame(game);
        container.appendChild(card);
      });
    }

    function playGame(game) {
      document.getElementById('games-container').style.display = 'none';
      const container = document.getElementById('game-container');
      const frame = document.getElementById('game-frame');
      const titleEl = document.getElementById('game-title');

      titleEl.textContent = game.title;
      frame.src = game.url;
      container.style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('games-container').style.display = 'grid';
      document.getElementById('game-frame').src = '';
    }

    function filterGames() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      let filtered = games;

      if (currentFilter !== "all") {
        filtered = filtered.filter(g => g.theme === currentFilter);
      }
      if (searchTerm) {
        filtered = filtered.filter(g => g.title.toLowerCase().includes(searchTerm));
      }

      renderGames(filtered);
    }

    // Zurück-Button + ESC
    document.getElementById('back-btn').addEventListener('click', closeGame);
    document.addEventListener('keydown', e => {
      if (e.key === "Escape") closeGame();
    });

    // Start
    renderThemes();
    renderGames(games);
  </script>
</body>
</html>
